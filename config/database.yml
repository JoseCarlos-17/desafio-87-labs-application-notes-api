# SQLite em todos os ambientes (arquivo persistido em Docker via volume em storage/).

default: &default
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

sqlite: &sqlite
  <<: *default
  adapter: sqlite3

development:
  <<: *sqlite
  database: storage/development.sqlite3

# Warning: the "test" DB is erased and re-generated when you run `rake test`.
test:
  adapter: sqlite3
  database: db/test.sqlite3
  timeout: 5000

production:
  <<: *sqlite
  database: storage/production.sqlite3
